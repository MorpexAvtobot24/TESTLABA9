name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-application
          path: target/sut-b-store-variant07-1.0-SNAPSHOT.jar
          if-no-files-found: error

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: store_variant07_test
          POSTGRES_USER: store_student
          POSTGRES_PASSWORD: store_student
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store_student -d store_variant07_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: store_variant07_test
      DB_USER: store_student
      DB_PASSWORD: store_student
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: warn

  integration-api-tests:
    name: Integration/API Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: store_variant07_test
          POSTGRES_USER: store_student
          POSTGRES_PASSWORD: store_student
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store_student -d store_variant07_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: store_variant07_test
      DB_USER: store_student
      DB_PASSWORD: store_student
      API_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/store_variant07_test
      SPRING_DATASOURCE_USERNAME: store_student
      SPRING_DATASOURCE_PASSWORD: store_student
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:migrations/V1__create_tables.sql,classpath:migrations/V2__add_indexes.sql
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-application
          path: target

      - name: Start Spring Boot application
        run: |
          java -jar target/sut-b-store-variant07-1.0-SNAPSHOT.jar > app.log 2>&1 &

          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:8080/products/999999999 || true)
            if [ "$status" = "200" ] || [ "$status" = "404" ]; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Spring Boot did not become ready"
              cat app.log
              exit 1
            fi
            sleep 2
          done

      - name: Run Postman collection with Newman
        run: |
          if [ ! -f postman_collection.json ]; then
            echo "::error::Postman collection not found: postman_collection.json"
            exit 1
          fi

          npx --yes newman run postman_collection.json \
            --env-var "baseUrl=http://127.0.0.1:8080" \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - name: Upload Postman/Newman test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-reports
          path: |
            newman-report.xml
            app.log
          if-no-files-found: warn
